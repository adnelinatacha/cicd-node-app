---
- name: Déployer une application Node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build image Docker localement
      shell: cd /home/ansible/cicd-node-app && docker build -t {{ docker_image }} .

    - name: Stop ancien conteneur
      shell: docker rm -f test-node-app || true

    - name: Lancer nouveau conteneur
      shell: docker run -d --name test-node-app -p 3000:3000 {{ docker_image }}
