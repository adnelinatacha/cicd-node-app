---
- name: Deploy Node App
  hosts: localhost
  become: yes
  tasks:
    - name: Pull docker image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull
    - name: Stop old container
      community.docker.docker_container:
        name: cicd-node-app
        state: absent
      ignore_errors: yes
    - name: Run new container
      community.docker.docker_container:
        name: cicd-node-app
        image: "{{ docker_image }}"
        state: started
        ports:
          - "3000:3000"
        restart_policy: always
